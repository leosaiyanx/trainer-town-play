<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#3aa0e8">
<title>Trainer Town</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-180.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="loader"><div class="ldIn">
  <div class="ldBall"></div>
  <h1>Trainer Town</h1>
  <div class="ldBar"><i id="ldFill"></i></div>
  <div class="ldRow"><span id="ldText">Packing Poké Balls…</span><b id="ldPct">0%</b></div>
  <p id="ldTip"></p>
</div></div>
<script>
(function () {
  var tips = ['Water beats Fire, Fire beats Grass, Grass beats Water!', 'Make a wild Pokémon tired before you throw a Poké Ball.', 'Push the stick all the way to run!', 'Tap the Map to fly to places you have visited.',
    'Electric moves are super strong against Water and Flying Pokémon.', 'Sparkly Pokémon are rare. Catch them fast!', 'Gohan and Goku help you in big battles.', 'Tap ⏸ any time to pause.', 'Team Rocket always blasts off in the end!'];
  var i = Math.floor(Math.random() * tips.length), cur = 0;
  function tip() { var e = document.getElementById('ldTip'); if (e) e.textContent = '💡 ' + tips[i++ % tips.length]; }
  tip(); setInterval(tip, 2800);
  window.LP = function (p, txt) { cur = Math.max(cur, p); var f = document.getElementById('ldFill'); if (f) f.style.width = cur + '%'; var pc = document.getElementById('ldPct'); if (pc) pc.textContent = Math.round(cur) + '%'; if (txt) { var t = document.getElementById('ldText'); if (t) t.textContent = txt + '…'; } };
  LP(4, 'Downloading the game');
})();
</script>
<canvas id="c"></canvas>
<div id="flash"></div>
<div id="bars"><i></i><i></i></div>
<div id="bossCard"></div>

<div id="hud" class="hide">
  <div id="stats">
    <div class="chip" id="chipBall"><i class="ball"></i><b id="nBall">0</b></div>
    <div class="chip" id="chipStar"><i class="dball"></i><b id="nStar">0</b>/7</div>
    <div class="chip hide" id="chipMedal" title="Champion">🏅</div>
    <div class="chip hide" id="chipEgg"><i class="egg"></i><div class="bar"><div id="eggBar"></div></div></div>
    <div class="chip hide" id="chipNet"><span id="netTxt">●</span></div>
  </div>
  <div id="btns">
    <button id="bTeam">Team</button>
    <button id="bMap">Map</button>
    <button id="bMenu">☰</button>
  </div>
  <div id="friends"></div>
  <div id="quest"></div>
</div>

<canvas id="mini" class="hide" width="264" height="264"></canvas>
<button id="miniBtn" class="hide">🗺</button>
<button id="bPause" class="hide" aria-label="Pause">⏸</button>
<button id="bUpdate" class="hide">⬆ New version — tap to update</button>
<div id="pause" class="hide"><div><b>⏸ Paused</b><button id="bResume">▶ Keep playing</button><small>The game is waiting for you.</small></div></div>
<div id="joy" class="hide"><div id="nub"></div></div>
<button id="act" class="hide">A</button>

<div id="dialog" class="hide"><b id="dwho"></b><p id="dtext"></p><span id="dnext">▼</span></div>
<div id="toast"></div>

<div id="battle" class="hide">
  <div class="mbox" id="foeBox"><div class="nm"><b id="foeName"></b><span id="foeLvl"></span></div><div class="hp"><div id="foeHp"></div></div><div id="foeDots"></div></div>
  <div class="mbox" id="myBox"><div class="nm"><b id="myName"></b><span id="myLvl"></span></div><div class="hp"><div id="myHp"></div></div><div class="xp"><div id="myXp"></div></div><small id="myHpTxt"></small></div>
  <div id="bmsg"></div>
  <div id="bmenu"></div>
</div>

<div id="panel" class="hide"><div id="panelIn"></div></div>

<div id="title" class="wait">
  <div id="tTop">
    <h1>Trainer Town</h1>
    <h2>Llorianne &amp; LJ's Adventure</h2>
  </div>
  <div id="tBot">
    <p class="pick">Who are you?</p>
    <div id="chars">
      <button class="card" data-ch="liko"><img id="pLiko" alt=""><b>Liko</b><span>with Sprigatito</span></button>
      <button class="card" data-ch="ash"><img id="pAsh" alt=""><b>Ash</b><span>with Pikachu</span></button>
    </div>
    <p class="dadrow"><button id="bDad" data-ch="dad" class="card dadcard">👨 Daddy mode <span>join in, watch, cheer and help</span></button></p>
    <p id="loading">Building the town… <span class="spin"></span></p>
    <p id="netNote"></p>
    <p><button id="bRoom" class="hide">👫 Family code</button></p>
    <p class="fine">A family fan game — made with love for Llorianne &amp; LJ</p>
  </div>
</div>

<script>
// Taps count from the first moment, even while the game code is still downloading.
document.addEventListener('click', function (e) {
  if (window.__gameLoaded) return;
  var c = e.target.closest ? e.target.closest('.card') : null; if (!c) return;
  window.__pick = c.getAttribute('data-ch');
  var all = document.querySelectorAll('.card'); for (var i = 0; i < all.length; i++) all[i].classList.toggle('picked', all[i] === c);
  document.getElementById('loading').firstChild.nodeValue = 'Downloading the game… it will start by itself ';
});
</script>
<script>window.addEventListener('error', function (e) { var l = document.getElementById('loading'); if (l) { l.classList.remove('hide'); l.textContent = 'Error: ' + e.message + ' (' + String(e.filename || '').split('/').pop() + ':' + e.lineno + ')'; } var t = document.getElementById('ldText'); if (t) t.textContent = 'Error: ' + e.message + ' (' + String(e.filename || '').split('/').pop() + ':' + e.lineno + ')'; });</script>
<script src="js/three.min.js"></script>
<script>LP(14, "Loading the 3D engine")</script>
<script src="js/core.js"></script>
<script>LP(18, "Meeting the Pokémon")</script>
<script src="js/dex.js"></script>
<script>LP(22, "Drawing the map")</script>
<script src="js/world.js"></script>
<script src="js/world2.js"></script>
<script src="js/world3.js"></script>
<script src="js/world4.js"></script>
<script src="js/world5.js"></script>
<script src="js/world6.js"></script>
<script src="js/world7.js"></script>
<script src="js/battle.js"></script>
<script src="js/peerjs.min.js"></script>
<script src="js/net.js"></script>
<script src="js/config.js"></script>
<script>LP(28, "Almost there")</script>
<script src="js/game.js"></script>
<script>if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(function () { });</script>
</body>
</html>
